# cargo-deny policy. Run `cargo deny check` to validate.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained. This is an unmaintained
    # advisory, not a known vulnerability. It reaches this project only
    # transitively, through the optional `local` feature's candle/fastembed
    # dependency tree; nothing this project calls directly depends on
    # `paste`. Revisit and drop this ignore once fastembed and its candle
    # dependencies move off `paste`. The default build (no optional
    # features) has zero advisories; this ignore only affects the optional
    # shipped `local` surface.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, pulled in transitively by the optional local feature's candle/fastembed tree, not used directly" },
]

[licenses]
version = 2
# Allowlist tuned to the current dependency tree; extend as `cargo deny check`
# reports new licenses (llama.cpp / fastembed deps may surface additional ones).
#
# This allowlist governs DEPENDENCIES, what LIAM consumes. It is not a
# statement about LIAM's own license, which is AGPL-3.0-only (see LICENSE).
# The two point in opposite directions on purpose: LIAM is strong copyleft
# outbound, and takes no strong copyleft inbound.
#
# LIAM must never take a GPL, LGPL, or AGPL DEPENDENCY. That is a hard
# constraint from the owner, not a preference. The workspace's own crates are
# AGPL-3.0-only and appear in the dependency graph, so they are listed as
# explicit exceptions below rather than by widening this allowlist, which
# would also let a third-party AGPL crate in unnoticed.
#
# cargo-deny 0.19 has no functional `deny` field for licenses: it was removed
# because every license not listed in `allow` below is already rejected by
# default (see the "version" field docs at
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html).
# Adding a `deny` array to this file fails config validation outright. So the
# list below is written down for policy intent, for a human reviewer, not as
# a live schema field: none of GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0,
# AGPL-3.0, MPL-1.1, or EUPL-1.2 may ever be added to `allow`. The absence
# from `allow` is what actually enforces this; this comment is the reason a
# reviewer should reject a PR that tries to add one of them anyway, rather
# than assuming it is a harmless allowlist extension.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "NCSA",                 # libfuzzer-sys, pulled in via rav1e -> ravif -> image -> fastembed
    "CDLA-Permissive-2.0",  # webpki-root-certs and webpki-roots, pulled in via ureq -> hf-hub
]
confidence-threshold = 0.9

# The workspace's own crates. They are AGPL-3.0-only, which the allowlist above
# deliberately does NOT contain, because that list is for what LIAM consumes and
# a third-party AGPL crate must still fail. Naming each of ours here keeps the
# distinction enforceable rather than relying on a comment: adding AGPL-3.0-only
# to `allow` would silently permit an AGPL dependency too.
[[licenses.exceptions]]
name = "liam-store"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "liam-model"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "liam-daemon"
allow = ["AGPL-3.0-only"]

# cargo-deny reads Cargo metadata only, so it cannot see C or C++ link-time
# dependencies at all. The vendored llama.cpp/ggml C++ sources, libstdc++,
# and OpenMP are invisible to every check in this file. Two things therefore
# need manual review whenever the llama dependency changes, because nothing
# here or in CI can catch either:
# - `llama-cpp-2` must always be declared with `default-features = false`.
#   `openmp` is in ITS default feature set, and enabling it links libgomp
#   (GPL, with a linking exception) on *-gnu targets.
# - `static-stdcxx` must never be enabled.

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
