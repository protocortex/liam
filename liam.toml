# liam-daemon configuration. Missing file or key falls back to defaults;
# unknown keys are rejected. Point elsewhere with LIAM_CONFIG=/path, or
# --config /path, which wins over the environment.
#
# All three modes read this file, but they use different parts of it:
#   liamd          stdio server: everything below except socket_path.
#   liamd serve    socket daemon: everything, including socket_path.
#   liamd proxy    stdio-to-socket shuttle: socket_path ONLY. It opens no
#                  store and loads no model, so database_path, [embedder],
#                  [llm], and [gc] are all ignored.

database_path  = "liam.db"
log_filter     = "info,liam=debug"   # RUST_LOG overrides when set
embedding_dims = 768              # MRL truncation length; fixed at DB creation
ask_timeout_secs = 30             # ask falls back to ranked evidence past this
ask_sufficiency_check = true      # extra yes/no pass so ask can refuse; costs one call
socket_path    = "~/.liam/liamd.sock"   # multi-client listener; ~ is expanded before binding
read_pool_size = 4                # independent read connections liam-store holds open
max_connections = 16              # cap on concurrent socket connections liamd serve holds open

[gc]
episode_retention_days = 30
interval_hours         = 6
reclaim                = true
run_on_start           = false

[embedder]
provider  = "mock"                       # "mock" (dev) or "local" (in-process)
model     = "Qwen/Qwen3-Embedding-0.6B"   # used when provider = "local"
cache_dir = "~/.liam/models"       # both reranker and embedder files land here

[llm]
provider        = "mock"                            # "mock" (dev) or "llama-cpp" (in-process llama.cpp)
model           = "Qwen/Qwen2.5-1.5B-Instruct-GGUF" # weights repo (quant files only)
gguf_file       = "qwen2.5-1.5b-instruct-q4_k_m.gguf"
# Architecture is auto-detected from the GGUF metadata: qwen2, qwen3, gemma/2/3,
# llama, mistral, phi3 all work. See crates/liam-daemon/src/eval.rs for scores.
cache_dir       = "~/.liam/models"
device          = "auto"   # auto | metal | cuda | cpu; auto = fastest compiled in, else cpu
warmup          = true     # pay Metal's ~10s first-call kernel compile at startup
context_tokens  = 8192     # sizes both the llama.cpp context and ask's evidence trimming
max_concurrent_generations = 1   # generation is serialized by default; raise if you have KV cache headroom

[producers]
unknown_id = "unknown"     # producer id recorded for a client not named in [producers.clients]

[producers.clients]
# MCP client name = canonical producer id, e.g.:
# claude-code  = "claude"
# ai-notetaker = "notetaker"
