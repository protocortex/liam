# liam-daemon configuration. Missing file or key falls back to defaults;
# unknown keys are rejected. Point elsewhere with LIAM_CONFIG=/path, or
# --config /path, which wins over the environment.
#
# All three modes read this file, but they use different parts of it:
#   liamd          stdio server: everything below except socket_path.
#   liamd serve    socket daemon: everything, including socket_path.
#   liamd proxy    stdio-to-socket shuttle: socket_path ONLY. It opens no
#                  store and loads no model, so database_path, [embedder],
#                  [llm], and [gc] are all ignored.

database_path  = "liam.db"
log_filter     = "info,liam=debug"   # RUST_LOG overrides when set
embedding_dims = 384              # MRL truncation length; fixed at DB creation
ask_timeout_secs = 30             # ask falls back to ranked evidence past this
ask_sufficiency_check = true      # extra yes/no pass so ask can refuse; costs one call
socket_path    = "~/.liam/liamd.sock"   # multi-client listener; ~ is expanded before binding
read_pool_size = 4                # independent read connections liam-store holds open
max_connections = 16              # cap on concurrent socket connections liamd serve holds open

[gc]
episode_retention_days = 30
interval_hours         = 6
reclaim                = true
run_on_start           = false

# Every write is recorded in an event log before it reaches the database. The
# database is a projection of that log and `liam rebuild` can recreate it.
[log]
# dir = "~/.liam/liam.log"      # default: <database stem>.log beside the database
#                               # relative: from the database's directory; must be empty or a log
# The first write after the open WAL segment reaches either limit closes it,
# and the compactor then turns it into Parquet.
wal_segment_max_bytes    = 8388608   # size limit of the open WAL segment
wal_rotate_interval_secs = 300       # age limit of the open WAL segment
bloom_fpr                = 0.01      # false positive rate of the dedup filter

# Snapshots the store, merges near-duplicates, runs maintenance and commits only
# if the probe set still recalls what it did before. Not the log's compactor.
[consolidation]
probe_recall_margin        = 0.02   # a probe whose recall drops by this much rolls the run back
dedup_similarity_threshold = 0.95   # cosine similarity at or above which two nodes are linked
probe_count                = 20     # most probes drawn from the store to gate a run
# snapshot_dir             = "~/.liam/liam.snapshots"   # default: <database stem>.snapshots beside the database

# Summaries of clusters of recorded nodes, built level by level by the
# consolidation job. Off until enabled. Needs a real llm provider, not the mock.
[summary]
enabled                 = false   # false makes the whole hook a no-op
provider                = "local"  # who writes summaries: local, or a hosted provider (needs [hosted])
knn                     = 8       # nearest neighbours considered for each item
min_similarity          = 0.5     # least cosine similarity at which two items are linked
time_window_hours       = 720     # items further apart than this are not linked
min_cluster_size        = 3       # fewest members of a cluster that gets a summary
max_cluster_size        = 30      # a larger cluster is split
max_depth               = 3       # levels of summaries above the nodes, at most 3
recluster_change_ratio  = 0.2     # share of a level that may change before it is clustered again
recluster_interval_days = 7       # age of the last full build after which a level is clustered again
min_attach_similarity   = 0.6     # least similarity to a cluster's centroid for a new item to join it
max_unattached          = 20      # new items that may wait unattached before a level is clustered again
max_summaries_per_run   = 20      # most summaries one run generates
run_deadline_secs       = 600     # bounds the generation of one run
min_grounded_share      = 0.5     # least share of a summary's content words its items must hold
max_summary_failures    = 3       # failures of one child set after which it is skipped
min_summary_similarity  = 0.5     # least similarity of a question to a summary for ask to use it
dissolve_grace_runs     = 3       # runs a summary whose cluster is gone waits for a replacement
dissolve_overlap        = 0.5     # share of its items a stored summary must hold to replace it
max_basis_ids_rendered  = 8       # event ids a provenance line lists before it counts the rest

# Moves items between the hot tier (vectors kept) and the cold tier (vectors
# dropped, text, edges and a bit signature kept) by how useful they have been.
# Off until enabled. Producer trust is read from [extraction.trust].
[tiering]
enabled                        = false   # false makes the tier step a no-op and counts nothing
w1                             = 0.4     # weight of the recent hits term
w2                             = 0.3     # weight of the recency term
w3                             = 0.2     # weight of the answer contribution term, left out for an item with no verdicts
w4                             = 0.1     # weight of the producer trust term
tau_days                       = 30.0    # days over which the recency term falls to 1/e
hits_cap                       = 20      # hits in the window at which the hits term reaches 1
hits_per_producer_item_day_cap = 10      # most hits one producer adds to one item in a day
hits_per_producer_day_cap      = 100     # most hits one producer adds across items in a day
unknown_trust_ceiling          = 0.3     # most trust the fallback producer can have, as author and as giver of verdicts
promote_threshold              = 0.5     # utility at or above which a cold item is promoted
demote_threshold               = 0.15    # utility below which a hot item is demoted
min_residency_days             = 7       # days a promoted item is protected from demotion
min_item_age_days              = 14      # least age of an item for it to be demoted
max_promotions_per_run         = 50      # most items one run promotes
max_demotions_per_run          = 50      # most items one run demotes, halved for each rollback in a row
window_days                    = 30      # days of usage that count, and of observation needed before any demotion
usage_flush_secs               = 60      # seconds between flushes of the in-memory access counts to the log
max_tracked_items              = 10000   # items the in-memory counts hold before the oldest is dropped
feedback_per_producer_per_hour = 60      # verdicts one producer may give per hour
feedback_item_cap              = 20      # most recent verdicts on one item that the score reads
feedback_prior_correct         = 1.0     # pseudo-verdicts of "correct" the contribution rate starts from
feedback_prior_incorrect       = 1.0     # pseudo-verdicts of "incorrect" the contribution rate starts from
cooldown_runs                  = 3       # runs a lineage moved by a rolled back run is left alone
cold_probe_pool                = 24      # cold items the probe contributes to one query
cold_oversample                = 4       # candidates asked of the signature index per item wanted
cold_max_hamming_ratio         = 0.35    # share of signature bits that may differ for a cold item to be a candidate
cold_arm_weight                = 0.5     # factor on the cold probe's contribution to a fused score
run_deadline_secs              = 600     # bounds the tier step of one run

# Seals new log events so a subject can be deleted by destroying its keys.
# Unset keeps a plaintext log. See "Deleting a subject" in the README before
# turning it on: the data keys are wrapped by this master key, and losing the
# master key or the key registry loses all log content.
[encryption]
# master_key = "file"           # "keychain" (macOS login keychain) or "file"
# key_file   = "~/.liam/master.key"   # for master_key = "file"; owner-readable only

# How `liamd delete` treats the data it destroys.
[deletion]
deadline_days = 30      # days a delete job has before it is reported as overdue
secure_delete = true    # zero the database pages a delete frees

# Producers that may call the `consolidate` and `delete` tools. A producer name
# is what a client claims, not an authenticated identity, so this guards against
# mistakes and not against abuse. Empty refuses everyone.
[admin]
producers = []

# Moves closed log partitions to another directory, compressed. Nothing is
# deleted. A partition that is archived and then lost makes a rebuild fail.
[archive]
enabled    = false      # false moves nothing
after_days = 90         # archive a closed partition once its newest event is this old
# dir      = "/mnt/liam-archive"   # required when enabled; must exist
zstd_level = 3          # 1 to 22; sealed bodies barely compress, so higher mostly costs time

# What the daemon measures about itself and when it raises an alert. The
# thresholds are starting values, not measured on real data.
[metrics]
enabled                    = true      # false keeps no metrics and exposes no readings
sink                       = "memory"  # "memory", or "log" to also log each active alert
min_samples                = 5         # samples a metric needs before a relative or rate rule alerts
delta_pct                  = 20.0      # percent a recall, latency, ece or Bloom rate may move between runs
rollback_ceiling           = 1.0       # rollbacks at which an alert is raised
extraction_backlog_ceiling = 10000.0   # events past an extraction cursor at which an alert is raised
model_calls_per_hour       = 1000.0    # model calls an hour at which an alert is raised

# Calls to hosted model providers (Anthropic, OpenAI, Gemini), for extraction
# and summaries. Off, and nothing leaves the machine, until every part below is
# set. Needs a build with `--features hosted`. Read "Hosted providers" in the
# README before turning it on.
[hosted]
enabled              = false     # false makes no hosted call
allowed_hosts        = []        # the only hosts a request may go to, for example ["api.anthropic.com"]
request_timeout_secs = 60        # how long one request may take, answer included
max_response_bytes   = 4194304   # the most bytes of a response that are read

# What may be sent. While it is empty, every item is kept at home.
[hosted.privacy]
allowed_scopes     = []   # scopes whose items may be sent; `work` covers `work/liam`; "" is the unscoped group
local_only_sources = []   # producers whose items are never sent, in any scope

# The region each provider processes requests in, as you declare it.
[hosted.privacy.provider_regions]
# anthropic = "us"

# For a scope and its descendants, the regions it may be sent to.
[hosted.privacy.attested_regions]
# work = ["us", "eu"]

# The dated model id each provider is pinned to. An alias such as
# `claude-sonnet-4-5` is refused: it can move to another model without notice.
[hosted.models]
# anthropic = "claude-sonnet-4-5-20250929"
# openai    = "gpt-4o-2024-08-06"
# gemini    = "gemini-2.0-flash-001"

# What each pinned model costs, in millionths of a dollar per million tokens.
# `version` names the table, so a recorded cost can be tied to its rates. The
# rates below are an example, not a price list: read your provider's.
[hosted.prices]
version = ""
[hosted.prices.models]
# "claude-sonnet-4-5-20250929" = { input_micro_per_mtok = 3000000, output_micro_per_mtok = 15000000, cached_input_micro_per_mtok = 300000, batch_input_micro_per_mtok = 1500000, batch_output_micro_per_mtok = 7500000 }

# A provider's key file: an absolute path to a file only its owner can read. A
# provider without one is read from the macOS Keychain, service `liam-<provider>`.
[hosted.key_files]
# anthropic = "/Users/you/.liam/anthropic.key"

[embedder]
provider  = "mock"                       # "mock" (dev) or "local" (in-process)
model     = "Qwen/Qwen3-Embedding-0.6B"   # used when provider = "local"
cache_dir = "~/.liam/models"       # both reranker and embedder files land here

[llm]
provider        = "mock"                            # "mock" (dev) or "llama-cpp" (in-process llama.cpp)
model           = "Qwen/Qwen2.5-1.5B-Instruct-GGUF" # weights repo (quant files only)
gguf_file       = "qwen2.5-1.5b-instruct-q4_k_m.gguf"
# Architecture is auto-detected from the GGUF metadata: qwen2, qwen3, gemma/2/3,
# llama, mistral, phi3 all work. See crates/liam-daemon/src/eval.rs for scores.
cache_dir       = "~/.liam/models"
device          = "auto"   # auto | metal | cuda | cpu; auto = fastest compiled in, else cpu
warmup          = true     # pay Metal's ~10s first-call kernel compile at startup
context_tokens  = 8192     # sizes both the llama.cpp context and ask's evidence trimming
max_concurrent_generations = 0   # 0 = auto-tune from a one-time benchmark; set a fixed number to disable

# Derives subject/predicate/object facts from the log. Off until enabled.
[extraction]
enabled              = false     # false makes the whole hook a no-op
provider             = "local"   # who answers the model half: local, or a hosted provider (needs [hosted])
llm_enabled          = true      # false extracts with the rules only
# llama_server_path  = "~/.liam/bin/llama-b11860/llama-server"   # where liam fetch-models puts it
# model_gguf         = "~/.liam/models/extraction.gguf"
# extra_args         = ["--threads", "4"]   # --host, --port, --api-key and --alias are set by liam
host                 = "127.0.0.1"   # loopback addresses only
port                 = 0         # 0 picks a free port
ctx_tokens           = 4096
request_timeout_secs = 120
start_timeout_secs   = 120
run_deadline_secs    = 600       # bounds one extraction run
ram_budget_mb        = 4096
max_events_per_run   = 200
batch_events         = 8
min_event_chars      = 40
max_batch_failures   = 3
# max_event_chars    = 4096      # default: half the context window in characters (8192 here)
# end_cues           = ["no longer"]   # added to the built-in English and Portuguese cues
max_competing_per_key = 5
min_confidence       = 0.5
llm_trust_factor     = 0.8       # share of a source's trust an LLM fact keeps
default_trust        = 0.5       # for a source not named below

[extraction.trust]
# source name = trust score in [0.0, 1.0]
# backfill = 0.3

[extraction.predicates]
# predicate = { cardinality = "one" | "many", match = "exact" | "contains", grounding = "text" | "date" }
# works_at = { cardinality = "many" }

[producers]
unknown_id = "unknown"     # producer id recorded for a client not named in [producers.clients]

[producers.clients]
# MCP client name = canonical producer id
ai-notetaker = "notetaker"
