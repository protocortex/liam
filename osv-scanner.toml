# The zip 8.6.0 and block-buffer 0.10.4 entries below expire on 2027-01-30, so
# they get re-checked against newer candle releases instead of lingering.

[[IgnoredVulns]]
id = "GHSA-m665-v7pm-7grj"
ignoreUntil = 2027-01-30
reason = """
`zip` parser differential (CVSS 10.0) between `ZipArchive` and
`ZipStreamReader`, which matters when a streaming extractor writes files to disk
using local header names. Only candle-core reads zip files here, and only
through `ZipArchive::new` with `by_name` and `by_index` on local `.npz` and
`.pt` model files. Nothing calls `ZipStreamReader`, `extract` or
`shallow_copy_file`, and nothing writes archive entries to disk. candle-core
0.11.0 pins `zip` 8.6.0 and zip 9 is semver incompatible, so no fixed version is
reachable until candle releases with `zip` 9. Drop this entry then.
"""

[[IgnoredVulns]]
id = "GHSA-hjqx-j4rw-g7xv"
ignoreUntil = 2027-01-30
reason = """
Symlink path escape in `ZipArchive::extract`. Nothing in candle or fastembed
calls `extract`. `zip` 8.x is pinned by candle-core 0.11.0. Drop this entry once
candle moves to `zip` 9.
"""

[[IgnoredVulns]]
