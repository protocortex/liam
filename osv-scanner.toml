"""

[[IgnoredVulns]]
id = "GHSA-9hj8-73fh-9963"
ignoreUntil = 2027-01-30
reason = """
Shrink decoder panic, reachable only with the `legacy-zip` feature and
`ZipArchive::extract`. candle-core depends on `zip` with default features off,
so `legacy-zip` is not compiled, and nothing calls `extract`. Drop this entry
once candle moves to `zip` 9.
"""

[[IgnoredVulns]]
id = "GHSA-8hxf-qr8p-62x4"
ignoreUntil = 2027-01-30
reason = """
Missing HMAC check on truncated AES-encrypted entries. AES needs the
`aes-crypto` feature, which candle-core leaves off (`default-features = false`),
and the model files read here are not encrypted. Drop this entry once candle
moves to `zip` 9.
"""

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-30
reason = """
`block-buffer` 0.10.4 has no fixed version. The flaw needs a caught panic inside
a buffer callback followed by continued use of the buffer. This version is
pulled only by `sha2` 0.10 under `cudaforge`, a build dependency of
`candle-kernels` that exists only with the optional `cuda` feature. It runs at
build time and never ships in the daemon. The shipped `sha2` 0.11 uses
`block-buffer` 0.12.1. Drop this entry once candle moves off `cudaforge`'s old
`sha2`.
"""
