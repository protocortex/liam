name: CI

on:
  # No base-branch filter here, on purpose. With `branches: [main]` a pull
  # request aimed at anything other than main ran zero code checks, so a stack
  # of PRs got only the governance workflows until each one was retargeted. A
  # clippy failure that only reproduces on Linux sat unnoticed in such a stack
  # until the PR was reopened against main. Retargeting alone does not help,
  # because changing the base fires `pull_request.edited`, which is not a
  # trigger; checks start on a freshly opened PR or on a push to its branch.
  #
  # A docs-only change skips the build jobs through the `changes` job below,
  # not through `paths-ignore`. Measured 2026-08-22: a CHANGELOG-only pull
  # request compiled Rust on macOS three times, for 2.1 macOS minutes, to prove
  # a markdown file still parses. The workflow itself has to run, because the
  # branch ruleset requires these checks and a merge queue needs them on every
  # merge group: a workflow skipped by `paths-ignore` never reports, which
  # would block a docs PR forever. A job skipped by `if:` reports as skipped,
  # which a required check accepts.
  #
  # Deliberately NOT treated as docs: Cargo.toml, Cargo.lock, deny.toml,
  # rust-toolchain and anything under .github/workflows. Those change what
  # gets built even when no .rs file moves.
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      # `**.md`, NOT `**/*.md`. GitHub's glob requires a directory separator
      # for the second form, so `**/*.md` would miss CHANGELOG.md at the repo
      # root, which is precisely the file that triggered this whole change.
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

# A newer push cancels a pull request run in progress. On main, a run in
# progress is left to finish; a third push replaces the one still queued.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Save the cache only from main. Measured 2026-08-22: the repo held 43 active
  # caches totalling 13.7 GB against GitHub's 10 GB per-repo limit, so GitHub
  # was evicting them LRU and jobs paid cold restores anyway. The cause was
  # every pull request branch saving its own copy of every job's cache: four
  # separate 568 MB entries existed for one Linux job alone.
  #
  # With this, main publishes one cache per job and pull requests restore from
  # it read-only. Total drops to roughly 3 GB, which fits, so restores actually
  # hit. It also removes a 22 to 26 second save step from every job on every
  # pull request run, which was costing more than the 10 to 17 second build it
  # was meant to protect.
  #
  # The trade: a long-lived branch that changes dependencies re-does that
  # dependency build on each run rather than caching its own tree. That is the
  # documented recommendation from Swatinem/rust-cache, and it is the cheaper
  # side of the trade here because the alternative evicts everyone's cache.
  CACHE_SAVE_IF: ${{ github.ref == 'refs/heads/main' }}

# Job timeouts are about 3x the slowest successful run over the last 100 runs
# (measured on the first cold run after the model stack became part of every
# build, 2026-11-09: lint 3m39s, test 7m34s, coverage 9m11s, macos 8m33s, deny
# 12s), with a 5 minute floor and extra room for a cold cache. They make a hung
# runner fail fast instead of holding the job for GitHub's 360 minute default.
jobs:
  # Decides whether the build jobs run. Push to main is already path filtered,
  # so it always builds. A pull request or merge group builds unless every
  # changed file is docs: `*.md` anywhere, `docs/`, LICENSE, or issue templates.
  # This job is a required check too: if it fails, every build job skips, and
  # only its own failure keeps the merge blocked.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          # The compare API lists at most this many files; a longer list is
          # treated as a code change rather than trusted as complete.
          MAX_LISTED_FILES: "300"
          DOCS_PATTERN: '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/'
        run: |
          if [ "$EVENT" = push ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          code_files=$(printf '%s\n' "$files" | grep -vE "$DOCS_PATTERN" | grep -c . || true)
          if [ "$count" -ge "$MAX_LISTED_FILES" ] || [ "$code_files" -gt 0 ] || [ "$count" -eq 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed files: $count, non-docs: $code_files"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ env.CACHE_SAVE_IF }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Linux only. The macOS half of this matrix moved into the `macos` job below,
  # so the workspace compiles once per platform instead of three times on the
  # expensive one.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ env.CACHE_SAVE_IF }}
      - name: Test
        run: cargo test --workspace

  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      # cargo-deny reads Cargo metadata only, so it cannot see the vendored
      # llama.cpp C++ sources, libgomp, or libstdc++. That C/C++ blind spot is
      # covered by manual review notes in deny.toml, not by this job.
      - run: cargo deny check

  # Blocking: fails below FLOOR. FLOOR is set from the real baseline measured
  # 2026-09-29 (96.55% line coverage), minus a few points of margin, so it
  # catches a real regression without failing on normal day-to-day noise.
  # Ratchet it up over time; never lower it without a documented reason.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLOOR: "95"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          # cargo-llvm-cov needs this component to invoke llvm-cov/llvm-profdata;
          # taiki-e/install-action only installs the cargo-llvm-cov binary itself.
          # Found missing during Step 9 adversarial review: without it this job
          # would fail every run, silently swallowed by continue-on-error.
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ env.CACHE_SAVE_IF }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov --workspace --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --workspace --summary-only --fail-under-lines "$FLOOR"

  # One macOS job: macOS bills at 10.3x Linux, so it runs the workspace tests
  # and the release-shaped build in one job that shares one target directory.
  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      # The runner image now ships Homebrew OpenSSL 4, which llama.cpp's CMake
      # finds but cannot link, so a cold build fails. The vendored server's
      # HTTPS support is unused here.
      CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "ON"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ env.CACHE_SAVE_IF }}
      - name: Test
        run: cargo test --workspace
      # Metal is compiled in by target inside llama-cpp-sys-2's build script,
      # so it needs no extra setup. The tests that need model weights are
      # #[ignore]d, so this downloads nothing and needs no GPU.
      - name: Build
        run: cargo build -p liam-daemon
