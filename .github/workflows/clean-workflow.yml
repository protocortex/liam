# Managed by github.com/protocortex/infra
#
# Weekly scheduled cleanup of old workflow run history.
# Deletes runs older than 7 days, keeping the 10 most recent per
# workflow. SHA-pinned for supply-chain safety.

name: clean-workflow

on:
  schedule:
    - cron: "0 4 * * 1"  # weekly Monday 04:00 UTC

permissions: {}

concurrency:
  group: clean-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - uses: igorjs/gh-actions-clean-workflow@d1b479dae48dbea1f254b3109fca0f7f57c1626f # v7
        with:
          runs_older_than: 7
          runs_to_keep: 10
