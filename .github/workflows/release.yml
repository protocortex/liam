name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # Gate: a tag must not publish if the event log loses a record at scale. The
  # same test runs weekly in log-soak.yml; here it blocks the release job.
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Soak (rows ingested, rebuilt, compared)
        shell: bash
        run: |
          set -euo pipefail
          # `cargo test` exits 0 when a filter matches nothing, so require
          # that the one soak test actually ran and passed.
          cargo test --release -p liam-store -- --ignored --exact \
            graph::tests::soak::soak_full_rebuild_loses_no_record \
            --nocapture 2>&1 | tee soak.log
          grep -q ' 1 passed' soak.log

  # v1 targets macOS only, so there is one target and no matrix. This workflow
  # previously also built x86_64-unknown-linux-gnu and published it, which
  # shipped an artifact for an unsupported platform.
  release:
    needs: soak
    runs-on: macos-latest
    # Publishing the release asset is the only step that writes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true

      # `local,llama` is not a nicety here, it is what makes the artifact
      # usable. `local` supplies the real embedder and reranker; `llama`
      # supplies generation. Built with only one of them the daemon either
      # refuses to start, when the config names the missing provider (the
      # `#[cfg(not(feature = ...))]` bails in crates/liam-daemon/src/main.rs),
      # or silently serves random embeddings and fabricated answers when the
      # config still says "mock". This workflow used to build `--features
      # local` alone and hit exactly that.
      #
      # Note this combination is compiled NOWHERE in ci.yml: the `test` job
      # builds `--features local`, `build-llama` builds `--features llama`,
      # and only `cargo deny` resolves the pair. A break in the combined build
      # therefore surfaces here first, during a tagged release.
      #
      # llama-cpp-sys-2 compiles llama.cpp from C++ via CMake. This is slow on a
      # cold cache, so expect a slow run rather than treating it as stuck.
      #
      # An earlier version of this comment said rust-cache does not cache that
      # CMake build. It does: measured 2026-08-22 at 9 seconds warm against 121
      # seconds cold, because llama-cpp-sys-2 is a dependency and rust-cache
      # keeps dependency build artifacts. A release still tends to run cold,
      # since it builds a feature combination and a profile that ordinary CI
      # does not, so its cache key rarely matches one CI just populated.
      #
      # Metal is enabled by target inside that build script, so it needs no
      # cargo feature.
      # Builds both binaries the package declares: `liamd`, the daemon, and
      # `liam`, the CLI that fetches models at install time.
      - name: Build release binaries
        run: cargo build --release -p liam-daemon --features local,llama

      # Cheapest possible proof that each binary links and starts. Worth
      # having for `liam` specifically: it is what the install script runs to
      # fetch weights, so a `liam` that cannot start turns into an install
      # that fails after the user has already downloaded the tarball.
      - name: Verify the binaries run
        run: |
          ./target/release/liamd --version
          ./target/release/liam --version

      # `liam fetch-models` downloads the pinned llama-server archive at install
      # time. If the upstream release were deleted or its bytes changed, the
      # first user to install would find out, so check the pin here instead.
      # The model is too large for a release runner; its hash was verified when
      # it was pinned. `cargo test` exits 0 when a filter matches nothing, so
      # require that the test ran.
      - name: Verify the pinned llama-server archive
        run: |
          set -euo pipefail
          cargo test --release -p liam-daemon --lib -- --ignored --exact \
            fetch::tests::real_server_asset_matches_its_pin 2>&1 | tee pin.log
          grep -q ' 1 passed' pin.log

      # The repo's liam.toml is the DEV config: both providers are "mock" so a
      # default `cargo build` stays light. Shipping it beside a real binary is
      # the failure this workflow used to have, and it is silent: the daemon
      # starts, `recall` returns noise from random vectors, and `ask`
      # fabricates. Deriving the shipped config from that same file keeps one
      # source of truth, and the assertions below fail the release rather than
      # let a bad substitution through.
      - name: Stage the release config
        run: |
          set -euo pipefail
          mkdir -p dist/staging
          python3 - <<'PY'
          import re, pathlib
          src = pathlib.Path("liam.toml").read_text()
          # Rewrite `provider` inside [embedder] and [llm] only, leaving every
          # other section, and all inline comments, untouched.
          want = {"embedder": "local", "llm": "llama-cpp"}
          section, out = None, []
          for line in src.splitlines(keepends=True):
              header = re.match(r"\s*\[([^\]]+)\]", line)
              if header:
                  section = header.group(1)
              elif section in want and re.match(r"\s*provider\s*=", line):
                  line = re.sub(r'"mock"', '"%s"' % want[section], line, count=1)
              out.append(line)
          pathlib.Path("dist/staging/liam.toml").write_text("".join(out))
          PY
          grep -Eq '^provider[[:space:]]*=[[:space:]]*"local"' dist/staging/liam.toml
          grep -Eq '^provider[[:space:]]*=[[:space:]]*"llama-cpp"' dist/staging/liam.toml
          if grep -Eq '^provider[[:space:]]*=[[:space:]]*"mock"' dist/staging/liam.toml; then
            echo "release config still selects a mock provider" >&2
            exit 1
          fi

      # "netinstall" in the README's Packaging sense: binaries, config, and
      # docs, with the weights fetched at install time by `liam fetch-models`
      # rather than shipped here. That is what install.sh does, and it is why
      # this artifact stays a few megabytes.
      #
      # The companion "bundle" artifact (weights included) is not produced
      # yet; its size needs measuring against the 2GB per-asset limit before
      # it is wired up, and the models the default config names come to more
      # than that together.
      #
      # Named `liam-` rather than `liamd-` because the tarball is no longer
      # just the daemon. No release has ever been published, so nothing
      # depends on the old name.
      - name: Package netinstall artifact
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          NAME="liam-${VERSION}-aarch64-apple-darwin-netinstall"
          install -m 0755 target/release/liamd dist/staging/liamd
          install -m 0755 target/release/liam dist/staging/liam
          install -m 0755 packaging/install.sh dist/staging/install.sh
          cp README.md LICENSE THIRD-PARTY-NOTICES.md dist/staging/
          cp packaging/dev.protocortex.liamd.plist dist/staging/
          tar -czf "dist/${NAME}.tar.gz" -C dist/staging .
          cd dist
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          cat "${NAME}.tar.gz.sha256"

      # install.sh reads these by name out of its own directory, so a rename
      # or a dropped `cp` above turns into a failure the user hits after
      # downloading rather than one this workflow catches. Cheap to assert.
      - name: Verify the artifact contains what install.sh expects
        run: |
          set -euo pipefail
          NAME="liam-${GITHUB_REF_NAME}-aarch64-apple-darwin-netinstall"
          listing="$(tar -tzf "dist/${NAME}.tar.gz")"
          for entry in ./liamd ./liam ./install.sh ./liam.toml ./dev.protocortex.liamd.plist; do
            echo "${listing}" | grep -Fxq "${entry}" || {
              echo "release artifact is missing ${entry}" >&2
              exit 1
            }
          done

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
