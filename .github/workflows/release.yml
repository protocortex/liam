name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Finishes the Homebrew tap step of a published release, or shows what it
  # would change. Neither builds or publishes anything. A real run needs the
  # default branch, a dry run works from any ref.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to move the Homebrew tap to, for example v0.1.2.'
        required: true
        type: string
      dry_run:
        description: 'Plan and show the formula change. Open nothing.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, and a running release is never cancelled. Dry runs
# have a group of their own, so they never replace a pending release.
concurrency:
  group: ${{ inputs.dry_run && 'release-dry-run' || 'release' }}
  cancel-in-progress: false

jobs:
  # Decides what this run does. A tag push builds and publishes, then moves the
  # tap. A manual run only moves the tap, for a release that is already
  # published.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      stable: ${{ steps.plan.outputs.stable }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            tag="$REF_NAME" publish=true dry_run=false
          else
            tag="$INPUT_TAG" publish=false dry_run="${INPUT_DRY_RUN:-false}"
          fi
          # `stable` is a plain vX.Y.Z. A pre-release tag still builds and
          # publishes, but the Homebrew formula does not follow it.
          stable=false
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then stable=true; fi
          if [ "$publish" = false ]; then
            if [ "$stable" != true ]; then
              echo "::error::'${tag}' is not a release tag vX.Y.Z" >&2
              exit 1
            fi
            if [ "$dry_run" != true ] && [ "$REF" != "$DEFAULT_REF" ]; then
              echo "::error::a real run needs ${DEFAULT_REF}, not ${REF}. Use dry_run from other refs." >&2
              exit 1
            fi
          fi
          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
            echo "publish=${publish}"
            echo "stable=${stable}"
            echo "dry_run=${dry_run}"
          } >>"$GITHUB_OUTPUT"
          echo "Release ${tag}: publish=${publish}, tap=${stable}, dry_run=${dry_run}" >>"$GITHUB_STEP_SUMMARY"

  # Gate: a tag must not publish if the event log loses a record at scale. The
  # same tests run weekly in log-soak.yml; here it blocks the release job.
  soak:
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Soak (rows ingested, rebuilt, compared)
        shell: bash
        run: |
          set -euo pipefail
          # `cargo test` exits 0 when a filter matches nothing, so require
          # that both soak tests, plain and sealed, actually ran and passed.
          # They run in parallel threads, so the 60 minute budget covers both.
          cargo test --release -p liam-store -- --ignored --exact \
            graph::tests::soak::soak_full_rebuild_loses_no_record \
            graph::tests::soak::soak_full_sealed_rebuild_loses_no_record \
            --nocapture 2>&1 | tee soak.log
          grep -q ' 2 passed' soak.log

  # v1 targets macOS only, so there is one target and no matrix. This workflow
  # previously also built x86_64-unknown-linux-gnu and published it, which
  # shipped an artifact for an unsupported platform.
  release:
    needs: [plan, soak]
    runs-on: macos-latest
    timeout-minutes: 45
    # Publishing the release asset is the only step that writes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true

      # `local,llama` is not a nicety here, it is what makes the artifact
      # usable. `local` supplies the real embedder and reranker; `llama`
      # supplies generation. Built with only one of them the daemon either
      # refuses to start, when the config names the missing provider (the
      # `#[cfg(not(feature = ...))]` bails in crates/liam-daemon/src/main.rs),
      # or silently serves random embeddings and fabricated answers when the
      # config still says "mock". This workflow used to build `--features
      # local` alone and hit exactly that.
      #
      # Note this combination is compiled NOWHERE in ci.yml: the `test` job
      # builds `--features local`, `build-llama` builds `--features llama`,
      # and only `cargo deny` resolves the pair. A break in the combined build
      # therefore surfaces here first, during a tagged release.
      #
      # llama-cpp-sys-2 compiles llama.cpp from C++ via CMake. This is slow on a
      # cold cache, so expect a slow run rather than treating it as stuck.
      #
      # An earlier version of this comment said rust-cache does not cache that
      # CMake build. It does: measured 2026-08-22 at 9 seconds warm against 121
      # seconds cold, because llama-cpp-sys-2 is a dependency and rust-cache
      # keeps dependency build artifacts. A release still tends to run cold,
      # since it builds a feature combination and a profile that ordinary CI
      # does not, so its cache key rarely matches one CI just populated.
      #
      # Metal is enabled by target inside that build script, so it needs no
      # cargo feature.
      # Builds both binaries the package declares: `liamd`, the daemon, and
      # `liam`, the CLI that fetches models at install time.
      - name: Build release binaries
        env:
          # Homebrew OpenSSL 4 on the runner breaks llama.cpp's CMake; its
          # HTTPS support is unused.
          CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "ON"
        run: cargo build --release -p liam-daemon --features local,llama

      # Cheapest possible proof that each binary links and starts. Worth
      # having for `liam` specifically: it is what the install script runs to
      # fetch weights, so a `liam` that cannot start turns into an install
      # that fails after the user has already downloaded the tarball.
      #
      # Each binary must also report the tag's version. v0.1.1 shipped binaries
      # that print 0.1.0 because Cargo.toml was not bumped before the tag, and
      # the Homebrew formula test asserts the version, so a mismatch is caught
      # here rather than after the release is public.
      - name: Verify the binaries run
        run: |
          set -euo pipefail
          for bin in liamd liam; do
            out="$(./target/release/$bin --version)"
            echo "$out"
            case "$out" in
              *" ${GITHUB_REF_NAME#v}") ;;
              *) echo "$bin reports '$out', not ${GITHUB_REF_NAME#v}. Bump the crate version and tag again." >&2; exit 1 ;;
            esac
          done

      # `liam fetch-models` downloads the pinned llama-server archive at install
      # time. If the upstream release were deleted or its bytes changed, the
      # first user to install would find out, so check the pin here instead.
      # The model is too large for a release runner; its hash was verified when
      # it was pinned. `cargo test` exits 0 when a filter matches nothing, so
      # require that the test ran.
      - name: Verify the pinned llama-server archive
        run: |
          set -euo pipefail
          cargo test --release -p liam-daemon --lib -- --ignored --exact \
            fetch::tests::real_server_asset_matches_its_pin 2>&1 | tee pin.log
          grep -q ' 1 passed' pin.log

      # The repo's liam.toml is the DEV config: both providers are "mock" so a
      # default `cargo build` stays light. Shipping it beside a real binary is
      # the failure this workflow used to have, and it is silent: the daemon
      # starts, `recall` returns noise from random vectors, and `ask`
      # fabricates. Deriving the shipped config from that same file keeps one
      # source of truth, and the assertions below fail the release rather than
      # let a bad substitution through.
      - name: Stage the release config
        run: |
          set -euo pipefail
          mkdir -p dist/staging
          python3 - <<'PY'
          import re, pathlib
          src = pathlib.Path("liam.toml").read_text()
          # Rewrite `provider` inside [embedder] and [llm] only, leaving every
          # other section, and all inline comments, untouched.
          want = {"embedder": "local", "llm": "llama-cpp"}
          section, out = None, []
          for line in src.splitlines(keepends=True):
              header = re.match(r"\s*\[([^\]]+)\]", line)
              if header:
                  section = header.group(1)
              elif section in want and re.match(r"\s*provider\s*=", line):
                  line = re.sub(r'"mock"', '"%s"' % want[section], line, count=1)
              out.append(line)
          pathlib.Path("dist/staging/liam.toml").write_text("".join(out))
          PY
          grep -Eq '^provider[[:space:]]*=[[:space:]]*"local"' dist/staging/liam.toml
          grep -Eq '^provider[[:space:]]*=[[:space:]]*"llama-cpp"' dist/staging/liam.toml
          if grep -Eq '^provider[[:space:]]*=[[:space:]]*"mock"' dist/staging/liam.toml; then
            echo "release config still selects a mock provider" >&2
            exit 1
          fi

      # "netinstall" in the Packaging sense of docs/getting-started/install.md: binaries, config, and
      # docs, with the weights fetched at install time by `liam fetch-models`
      # rather than shipped here. That is what install.sh does, and it is why
      # this artifact stays a few megabytes.
      #
      # The companion "bundle" artifact (weights included) is not produced
      # yet; its size needs measuring against the 2GB per-asset limit before
      # it is wired up, and the models the default config names come to more
      # than that together.
      #
      # Named `liam-` rather than `liamd-` because the tarball is no longer
      # just the daemon. No release has ever been published, so nothing
      # depends on the old name.
      - name: Package netinstall artifact
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          NAME="liam-${VERSION}-aarch64-apple-darwin-netinstall"
          install -m 0755 target/release/liamd dist/staging/liamd
          install -m 0755 target/release/liam dist/staging/liam
          install -m 0755 packaging/install.sh dist/staging/install.sh
          cp README.md LICENSE THIRD-PARTY-NOTICES.md dist/staging/
          # The README links into docs/, so ship the guide pages with it. The
          # adr, plans and specs folders are history and stay out.
          mkdir -p dist/staging/docs
          cp docs/README.md dist/staging/docs/
          cp -R docs/getting-started docs/reference docs/concepts docs/operations docs/development dist/staging/docs/
          cp packaging/dev.protocortex.liamd.plist dist/staging/
          tar -czf "dist/${NAME}.tar.gz" -C dist/staging .
          cd dist
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          cat "${NAME}.tar.gz.sha256"
          # SHA256SUMS is the file the Homebrew tap reads to write the formula
          # checksum, in `sha256sum` format with the archive name as published.
          # The per-archive .sha256 file stays for older tooling.
          shasum -a 256 "${NAME}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      # install.sh reads these by name out of its own directory, so a rename
      # or a dropped `cp` above turns into a failure the user hits after
      # downloading rather than one this workflow catches. Cheap to assert.
      - name: Verify the artifact contains what install.sh expects
        run: |
          set -euo pipefail
          NAME="liam-${GITHUB_REF_NAME}-aarch64-apple-darwin-netinstall"
          listing="$(tar -tzf "dist/${NAME}.tar.gz")"
          for entry in ./liamd ./liam ./install.sh ./liam.toml ./dev.protocortex.liamd.plist \
              ./docs/README.md ./docs/getting-started/install.md \
              ./docs/reference/configuration.md ./docs/concepts/event-log.md ./docs/development/workspace.md; do
            echo "${listing}" | grep -Fxq "${entry}" || {
              echo "release artifact is missing ${entry}" >&2
              exit 1
            }
          done

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS

  # Downloads the published archive again and checks it against SHA256SUMS and
  # the per-archive .sha256 file (scripts/verify-release.sh). A bad upload fails
  # the run here, before anything downstream trusts the checksum. There is no
  # attestation check, because this workflow does not produce one.
  verify:
    needs: [plan, release]
    # After a publish, or for a manual run that moves the tap. Not on a dry run.
    if: >-
      ${{ !cancelled()
      && needs.plan.result == 'success'
      && ((needs.plan.outputs.publish == 'true' && needs.release.result == 'success')
          || (needs.plan.outputs.publish != 'true' && needs.plan.outputs.dry_run != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify the published archive
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: scripts/verify-release.sh "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

  # Writes the formula for this release with the tap's own bump script. This
  # job has no secrets and no write permission, because it runs code from
  # another repository. It returns the finished formula as text. A dry run
  # without a published SHA256SUMS reads stand-in checksums.
  formulas:
    needs: [plan, verify]
    if: >-
      ${{ !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.stable == 'true'
      && (needs.verify.result == 'success' || needs.plan.outputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      liam: ${{ steps.write.outputs.liam }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: protocortex/homebrew-tap
          path: tap
          persist-credentials: false

      - name: Write the formula
        id: write
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ] \
            && ! curl -fsSL -o /dev/null "https://github.com/protocortex/liam/releases/download/${TAG}/SHA256SUMS"; then
            asset="liam-${TAG}-aarch64-apple-darwin-netinstall.tar.gz"
            mkdir "$RUNNER_TEMP/sums"
            printf '%s  %s\n' "$(printf '%s' "$asset" | sha256sum | cut -d' ' -f1)" "$asset" >"$RUNNER_TEMP/sums/SHA256SUMS"
            export DOWNLOAD_BASE="file://$RUNNER_TEMP/sums"
            echo "::notice::${TAG} has no SHA256SUMS, so this dry run uses a placeholder checksum."
          fi
          (cd tap && .github/scripts/bump-formula.sh "$VERSION" Formula/liam.rb)
          echo "liam=$(base64 -w0 <tap/Formula/liam.rb)" >>"$GITHUB_OUTPUT"

  # Opens the release/vX.Y.Z pull request in the tap with that formula, waits
  # for its checks, merges it, and waits for the tap to publish its release.
  # This job holds the token, so it runs nothing from the tap checkout: it only
  # reads the formula, and scripts/release-tap.sh refuses any change except the
  # stable url and the sha256 in SHA256SUMS. A dry run needs no token.
  downstream:
    needs: [plan, formulas]
    if: ${{ !cancelled() && needs.formulas.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Only files are read from this checkout. No code from it runs here.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: protocortex/homebrew-tap
          path: tap
          persist-credentials: false

      - name: Write the formula
        env:
          LIAM_RB: ${{ needs.formulas.outputs.liam }}
        run: base64 -d <<<"$LIAM_RB" > tap/Formula/liam.rb

      # The GitHub App secrets are organization secrets, shared by all
      # repositories. The token is limited to the tap and to what the script
      # needs: contents and pull requests to open and merge the release pull
      # request, actions to read the checks run.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        id: app
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: protocortex
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read

      - name: Move the tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: scripts/release-tap.sh "$VERSION" tap
