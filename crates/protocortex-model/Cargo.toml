[package]
name = "protocortex-model"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "In-process embedding and reranking for protocortex, via fastembed-rs."

[dependencies]
async-trait = "0.1"
thiserror = "2"

# In-process local models (embedder + reranker). No server, offline after the
# model is present. Confirm the fastembed v5 API surface with `cargo add fastembed`.
fastembed = { version = "5", features = ["qwen3"], optional = true }
# Pinned to fastembed 5.17's candle line; 0.11 has incompatible Device/DType types.
candle-core = { version = "0.10", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
default = []
# The shipped path: fastembed in-process, Qwen3 embedder + cross-encoder reranker.
local = ["dep:fastembed", "dep:candle-core", "dep:tokio"]
