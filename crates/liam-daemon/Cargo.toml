[package]
name = "liam-daemon"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "MCP server exposing liam memory to agents."

# Two binaries, one crate, on purpose. `liamd` is the daemon; `liam` is the
# CLI a person runs. They must agree exactly on how liam.toml is read and
# where models are cached, so that shared half lives in this crate's library
# target (src/lib.rs) where neither can drift from the other. Splitting the
# CLI into its own crate would not reduce what it links (it would depend on
# this one regardless) and would add a seam for the two to disagree across.
[[bin]]
name = "liamd"
path = "src/main.rs"

[[bin]]
name = "liam"
path = "src/bin/liam.rs"

[dependencies]
liam-store = { path = "../liam-store" }
liam-model = { path = "../liam-model" }

async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
schemars = "1"
# `remember`'s `attributes` argument is a caller-supplied JSON object, passed
# straight through to `liam_store::NewNode::with_attributes`.
serde_json = "1"
time = "0.3"
# Mode dispatch. Declared directly even though leiden-rs pulls clap in through
# liam-store anyway, and always will now that ADR-0002 made clustering
# unconditional: a transitive edge belongs to a crate under no obligation to
# keep it, and losing argument parsing to someone else's minor release is not a
# trade worth making. The argument decides whether this
# process opens the store at all, so a typo like `liamd serv` has to exit 2 with
# a usage error rather than fall through to the store-opening default and take
# the lock the real daemon needs. Hand-rolled argv matching gets that wrong by
# omission, which is the expensive kind of wrong here.
clap = { version = "4", features = ["derive"] }
# WU-6c's ordered shutdown needs exactly one thing from here:
# `CancellationToken`, to tell the accept loop to stop taking new connections.
# Already in the shipped tree via rmcp's `transport-async-rw`, so this is a new
# direct edge, not a new crate. No features: `tokio_util::sync` is ungated, and
# the drain uses `tokio::task::JoinSet` rather than `TaskTracker` because a
# tracker can only WAIT for tasks, and the drain has to abort the ones still
# running when the deadline passes.
tokio-util = { version = "0.7", default-features = false }

# launchd socket activation (WU-6b). macOS-only BY TARGET, not by cargo feature:
# `launch_activate_socket` is a libSystem call that exists nowhere else, so a
# Linux build must never see this crate. Same pattern liam-model uses for Metal.
[target.'cfg(target_os = "macos")'.dependencies]
raunch = "1.0.1"

[dev-dependencies]
# storelock tests need an isolated, disposable directory per test.
tempfile = "3"
# WU-8's two-client acceptance test needs a real MCP client to drive the
# socket from the outside. `client` is the only feature this actually adds:
# production plays the server role only, and `transport-async-rw` is already
# enabled by the line-24 entry's feature graph. Resolver v2 (implied by
# edition 2021) keeps dev-only features out of the production build, so
# `client` stays out of `liamd`. Verify with:
#   cargo tree -e no-dev -p liam-daemon -f "{p} {f}" | grep "rmcp v"
# which must NOT list `client` (plain `cargo tree` will, and should).
rmcp = { version = "3", features = ["client", "transport-async-rw"] }

[features]
default = []
# Ship with in-process models (fastembed). Without it, the daemon uses the mock
# embedder and identity reranker, which keeps the base build light for dev.
local = ["liam-model/local"]
# Opt-in NVIDIA support; needs the CUDA toolkit at build time. Apple GPU support
# is automatic on macOS, see liam-model's target-specific dependencies.
cuda = ["liam-model/cuda"]
# llama.cpp text generation, replacing candle. Metal is on by target inside
# llama-cpp-sys-2's build script for Apple platforms, no cargo feature needed.
llama = ["liam-model/llama"]
