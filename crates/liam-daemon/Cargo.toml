[package]
name = "liam-daemon"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "MCP server exposing liam memory to agents."

[[bin]]
name = "liamd"
path = "src/main.rs"

[dependencies]
liam-store = { path = "../liam-store" }
liam-model = { path = "../liam-model" }

async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
schemars = "1"
time = "0.3"
# WU-6c's ordered shutdown: `CancellationToken` to tell live sessions to stop,
# `TaskTracker` to wait for them. Already in the shipped tree via rmcp's
# `transport-async-rw`, so this adds a feature edge, not a new crate. `rt` is
# what gates `tokio_util::task::TaskTracker`.
tokio-util = { version = "0.7", features = ["rt"] }

# launchd socket activation (WU-6b). macOS-only BY TARGET, not by cargo feature:
# `launch_activate_socket` is a libSystem call that exists nowhere else, so a
# Linux build must never see this crate. Same pattern liam-model uses for Metal.
[target.'cfg(target_os = "macos")'.dependencies]
raunch = "1.0.1"

[dev-dependencies]
# Tests construct store `Hit`s directly, whose `attributes` is a JSON value.
serde_json = "1"
# storelock tests need an isolated, disposable directory per test.
tempfile = "3"
# WU-8's two-client acceptance test needs a real MCP client to drive the
# socket from the outside. `client` is the only feature this actually adds:
# production plays the server role only, and `transport-async-rw` is already
# enabled by the line-24 entry's feature graph. Resolver v2 (implied by
# edition 2021) keeps dev-only features out of the production build, so
# `client` stays out of `liamd`. Verify with:
#   cargo tree -e no-dev -p liam-daemon -f "{p} {f}" | grep "rmcp v"
# which must NOT list `client` (plain `cargo tree` will, and should).
rmcp = { version = "3", features = ["client", "transport-async-rw"] }

[features]
default = []
# Ship with in-process models (fastembed). Without it, the daemon uses the mock
# embedder and identity reranker, which keeps the base build light for dev.
local = ["liam-model/local"]
# Opt-in NVIDIA support; needs the CUDA toolkit at build time. Apple GPU support
# is automatic on macOS, see liam-model's target-specific dependencies.
cuda = ["liam-model/cuda"]
# llama.cpp text generation, replacing candle. Metal is on by target inside
# llama-cpp-sys-2's build script for Apple platforms, no cargo feature needed.
llama = ["liam-model/llama"]
