[package]
name = "liam-model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "In-process embedding for liam, via fastembed-rs and ONNX Runtime."

[dependencies]
async-trait = "0.1"
thiserror = "2"

# In-process ONNX embedder. No server, offline after the model is present.
fastembed = "5"
# "rt" for spawn_blocking: the embedder runs blocking model calls on it
# instead of the async runtime.
tokio = { version = "1", features = ["rt", "sync"] }
tracing = { workspace = true }

# hf-hub downloads the pinned embedder files. Version
# matches what fastembed 5.17 already pulls in (hf-hub 0.5), so it does not
# duplicate the dep tree.
hf-hub = "0.5"

# Hashes a pinned embedder file once before the ONNX session reads it.
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[lints]
workspace = true
