[package]
name = "liam-model"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "In-process embedding and reranking for liam, via fastembed-rs."

[dependencies]
async-trait = "0.1"
thiserror = "2"

# In-process local models (embedder + reranker). No server, offline after the
# model is present. Confirm the fastembed v5 API surface with `cargo add fastembed`.
fastembed = { version = "5", features = ["qwen3"], optional = true }
# Tracks the candle-core 0.11 line; fastembed 5.17.3+ itself moved onto
# candle-core 0.11, so this stays in lockstep with what fastembed resolves.
candle-core = { version = "0.11", optional = true }
# "rt" for spawn_blocking (the decode loop), "sync" for the async mutex that
# serializes the single chat session without blocking a runtime thread.
tokio = { version = "1", features = ["rt", "sync"], optional = true }

# Generative chat model for the Llm trait (feature `local`). Tracks the
# candle-core 0.11 line (candle-transformers 0.11 depends on candle-core
# 0.11). hf-hub/tokenizers versions match what fastembed 5.17 already pulls
# in (hf-hub 0.5, tokenizers 0.22), so `local` doesn't duplicate the dep tree.
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.22", optional = true }
hf-hub = { version = "0.5", optional = true }
# `candle_chat::Session::load`/`complete` return `anyhow::Result` to keep the
# version-fragile candle glue's error handling simple; the `Llm` impl converts
# to `ModelError::Llm` at the trait boundary.
anyhow = { version = "1", optional = true }

# llama.cpp bindings for the Llm trait (feature `llama`), replacing the
# hand-written candle text generation above. `encoding_rs` because
# `token_to_piece` streams bytes through a decoder of that crate's type.
llama-cpp-2 = { version = "0.1.154", optional = true, default-features = false, features = ["common"] }
encoding_rs = { version = "0.8", optional = true }

# Best available backend per host, unioned into the deps above. WHY here and not
# in `[features]`: this is the only way `--features local` gives a macOS user GPU
# decode without them passing an extra flag, while a Linux user is not asked for a
# CUDA toolchain they may not have. Metal and Accelerate are system frameworks on
# macOS, so this adds no download and no toolchain requirement.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", optional = true, features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11", optional = true, features = ["metal", "accelerate"] }

[features]
default = []
# The shipped path: fastembed in-process, Qwen3 embedder + cross-encoder reranker.
# GPU decode. Metal needs NO feature: the macOS target block above always builds
# candle with it, and the code selects it by `cfg(target_os = "macos")`. CUDA is
# opt-in because it needs the CUDA toolkit and nvcc at BUILD time, which no
# default build may assume.
cuda = ["candle-core/cuda", "candle-transformers/cuda"]
local = [
    "dep:fastembed",
    "dep:candle-core",
    "dep:tokio",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:anyhow",
]
llama = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:anyhow", "dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
