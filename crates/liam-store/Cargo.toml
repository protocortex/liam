[package]
name = "liam-store"
version = "0.1.0"
edition = "2021"
description = "A bitemporal graph store with hybrid retrieval, generic over libSQL or SQLite."
license = "Apache-2.0"

# Pin exact versions with `cargo add`. Enable exactly one backend feature.
[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "2"
tracing = "0.1"
liam-log = { path = "../liam-log" }
# The log's event ids are v7 UUIDs, so they sort by creation time.
uuid = { version = "1.27.0", default-features = false, features = ["std", "v7"] }

# Local-only: drop default replication/remote/sync/tls features, which pull the
# hyper-rustls -> rustls-webpki -> webpki-roots stack (unused by this local-first
# store and the source of several RUSTSEC advisories + a CDLA license).
libsql = { version = "0.9", optional = true, default-features = false, features = ["core"] }
# Not optional: the injected log handle is a `tokio::sync::Mutex`, and
# `liam-log` already pulls tokio into every build.
tokio = { version = "1", features = ["rt", "sync"] }
# Leiden community detection. Not optional: ADR-0002 makes clustering part of
# every build, so there is no longer a feature to gate it behind.
#
# Pinned exactly rather than by caret range. ADR-0002 cites specific line
# numbers in this crate's source (`src/leiden.rs:478` for
# `run_with_initial_partition`, `src/partition.rs:29` for
# `Partition::from_membership`, `src/leiden.rs:441` for the renumbering that
# makes community ids non-durable), and the warm-start design depends on those
# exact semantics. A caret range lets `cargo update` move them silently, which
# is the failure this crate's own VERSION CHECK comments exist to prevent.
leiden-rs = "=0.8.1"

[features]
default = ["backend-libsql"]
# The read pool and write mutex in `backends/libsql.rs` need
# `tokio::sync::Mutex`, which this crate depends on directly rather than
# through libsql's own tokio features.
backend-libsql = ["dep:libsql"]
# There is deliberately NO `cluster` feature here, and adding one back would be
# a regression. It was deleted per ADR-0002
# (docs/adr/0002-cluster-recompute-cadence.md, milestone M5): clustering is part
# of every build so a release cannot ship without it.
#
# `recompute_communities` having had no production caller was the reason to WIRE
# IT UP, never the reason to gate or drop it. That reading has been made twice
# and was wrong both times.

[dev-dependencies]
# rt-multi-thread: the concurrent-write test needs writes to actually race
# from separate OS threads, not just interleave cooperatively.
# time: the read-during-write test wraps its assertion in a timeout so a
# regression hangs the test instead of the whole suite.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
liam-log = { path = "../liam-log", features = ["test-support"] }
