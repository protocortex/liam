[package]
name = "liam-store"
version = "0.1.0"
edition = "2021"
description = "A bitemporal graph store with hybrid retrieval, generic over libSQL or SQLite."
license = "MIT OR Apache-2.0"

# Pin exact versions with `cargo add`. Enable exactly one backend feature.
[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "2"
tracing = "0.1"

# Local-only: drop default replication/remote/sync/tls features, which pull the
# hyper-rustls -> rustls-webpki -> webpki-roots stack (unused by this local-first
# store and the source of several RUSTSEC advisories + a CDLA license).
libsql = { version = "0.9", optional = true, default-features = false, features = ["core"] }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
sqlite-vec = { version = "0.1", optional = true }
zerocopy = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt", "sync"], optional = true }
leiden-rs = { version = "0.8", optional = true }

[features]
default = ["backend-libsql", "cluster"]
# `dep:tokio` is wired to backend-libsql too: the read pool and write mutex in
# `backends/libsql.rs` need `tokio::sync::Mutex`, and that must not depend on
# libsql's own tokio features happening to pull it in, because that coupling
# breaks silently the moment libsql's feature set changes.
backend-libsql = ["dep:libsql", "dep:tokio"]
backend-rusqlite = ["dep:rusqlite", "dep:sqlite-vec", "dep:zerocopy", "dep:tokio"]
cluster = ["dep:leiden-rs"]

[dev-dependencies]
# rt-multi-thread: the concurrent-write test needs writes to actually race
# from separate OS threads, not just interleave cooperatively.
# time: the read-during-write test wraps its assertion in a timeout so a
# regression hangs the test instead of the whole suite.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
