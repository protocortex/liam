[package]
name = "liam-log"
version = "0.1.0"
edition = "2021"
description = "Event log crate for write-ahead logging and Parquet compaction."
license = "Apache-2.0"

[features]
# Exposes the failing LogWriter double to other crates' tests.
test-support = []

[dependencies]
arrow-array = { version = "60.0.0", default-features = false }
arrow-schema = { version = "60.0.0", default-features = false }
async-trait.workspace = true
crc32fast = { version = "1.5.2", default-features = false }
fastbloom = { version = "0.17.0", default-features = false }
object_store = { version = "0.14.2", default-features = false, features = ["fs"] }
parquet = { version = "60.0.0", default-features = false, features = ["arrow"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde.workspace = true
sha2 = { version = "0.11.0", default-features = false, features = ["alloc"] }
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
tracing.workspace = true
uuid = { version = "1.27.0", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
futures-core = { version = "0.3", default-features = false, features = ["alloc"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt", "time"] }
