[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
# 1.89 is the highest rust-version any resolved dependency declares (aes and uuid) and what
# the code needs (File::try_lock). CI builds on the pinned toolchain only, so this minimum is
# declared, not tested.
rust-version = "1.89"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
cast_sign_loss = "warn"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
